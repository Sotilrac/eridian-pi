# Route ALSA at the PCM5102A I2S DAC rather than HDMI.
#
# The card is selected by name, not index, so it survives renumbering when
# the vc4-hdmi codec probes in a different order after an update.
#
# The PCM5102A has no hardware mixer, which is why there is no volume
# control here: level is set on the MAX9744 over I2C instead.

pcm.!default {
    type plug
    slave.pcm "hw:CARD=sndrpihifiberry,DEV=0"
}

ctl.!default {
    type hw
    card "sndrpihifiberry"
}
